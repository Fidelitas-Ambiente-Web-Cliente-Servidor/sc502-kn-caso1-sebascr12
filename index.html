<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Ficticio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet" />

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="bg-dark text-white text-center py-5 mb-5 shadow">
    <div class="container">
      <h1 class="display-4 fw-bold">Restaurante CasoEstudio</h1>
    </div>
  </header>


  <main class="container mb-5">
    <!-- menu -->
    <section class="mb-5">
      <h2 class="text-center mb-4">Menú</h2>
      <!-- filtros -->
      <div class="d-flex justify-content-center gap-2 mb-4" id="contenedor-filtros">
        <button class="btn btn-outline-primary active" data-categoria="Todos">Todos</button>
        <button class="btn btn-outline-primary" data-categoria="Entrada">Entradas</button>
        <button class="btn btn-outline-primary" data-categoria="Plato Fuerte">Platos Fuertes</button>
        <button class="btn btn-outline-primary" data-categoria="Postre">Postres</button>
      </div>
      <!-- container de datos, se llena desde js -->
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="contenedor-menu">
      </div>
    </section>

    <!-- reservas -->
    <hr class="my-5" />
    <section>
      <div class="row g-5">
        <!-- a la izquierda el formulario de reservas -->
        <div class="col-lg-5">
          <div class="card p-4 shadow-sm">
            <h3 class="mb-4">Reservar una Mesa</h3>

            <form id="form-reserva" novalidate>
              <!-- nombre -->
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo *</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                <div class="error-campo" id="error-nombre"></div>
              </div>
              <!-- correo -->
              <div class="mb-3">
                <label for="correo" class="form-label">Correo *</label>
                <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" required>
                <div class="error-campo" id="error-correo"></div>
              </div>
              <!-- fecha -->
              <div class="mb-3">
                <label for="fecha" class="form-label">Fecha de Reserva *</label>
                <input type="date" class="form-control" id="fecha" required>
                <div class="error-campo" id="error-fecha"></div>
              </div>
              <!-- hora -->
              <div class="mb-3">
                <label for="hora" class="form-label">Hora *</label>
                <select class="form-select" id="hora" required>
                  <option value="" disabled selected>Seleccione una hora...</option>
                  <option value="12:00">12:00</option>
                  <option value="13:00">13:00</option>
                  <option value="18:00">18:00</option>
                  <option value="19:00">19:00</option>
                  <option value="20:00">20:00</option>
                </select>
                <div class="error-campo" id="error-hora"></div>
              </div>
              <!-- personas -->
              <div class="mb-3">
                <label for="personas" class="form-label">Numero de Personas (1-20) *</label>
                <input type="number" class="form-control" id="personas" min="1" max="20" placeholder="Ej. 4" required>
                <div class="error-campo" id="error-personas"></div>
              </div>
              <!-- comentarios -->
              <div class="mb-3">
                <label for="comentarios" class="form-label">Comentarios (Opcional)</label>
                <textarea class="form-control" id="comentarios" rows="3"
                  placeholder="Restricciones alimenticias, celebración, etc."></textarea>
              </div>
              <!-- envuar -->
              <button type="submit" class="btn btn-primary w-100" id="btn-submit" disabled>
                Confirmar Reserva
              </button>
            </form>
          </div>
        </div>


        <!-- reservas registradas -->
        <div class="col-lg-7">
          <div class="card p-4 shadow-sm h-100">
            <h3 class="mb-4">Reservas Registradas</h3>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Personas</th>
                  </tr>
                </thead>
                <tbody id="tbody-reservas">
                  <!-- las filas con clase .fila-reserva se agregan hacia abajo -->
                </tbody>
              </table>
            </div>
            <!-- resumen de reservas -->
            <div class="resumen-reservas mt-4 p-3 rounded" id="resumen-reservas">
              <p class="mb-1"><strong>Total de reservas:</strong> <span id="resumen-total">0</span></p>
              <p class="mb-1"><strong>Total personas esperadas:</strong> <span id="resumen-personas">0</span></p>
              <p class="mb-0"><strong>Mayor número de personas en una reserva:</strong> <span
                  id="resumen-mayor">N/A</span></p>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>

</body>

<!-- footer -->
<footer class="bg-navy text-light py-5 mt-5">
  <div class="container">
    <div class="row mt-4 pt-3 border-top border-secondary">
      <div class="col-12 text-center text-secondary small">
        © 2026 Restaurante Caso de Estudio. Todos los derechos reservados.
        Sebastian Pina Guevara
      </div>
    </div>
  </div>
</footer>

</html>
